<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><title>StudyBloom 🌿</title>
<style>
:root{--bg:#f4f0df;--card:#fffaf0;--ink:#294235;--muted:#6d7b70;--accent:#5d8b65;--line:#d8dfcf}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#e8efd9);color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.hero,.row{display:flex;gap:10px;align-items:center}.hero{justify-content:space-between;margin-bottom:18px}.logo{font-size:34px;font-weight:900}.tag,.small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 30px #29423518}.wide{grid-column:1/-1}.between{justify-content:space-between}.timer{text-align:center;font-size:56px;font-weight:900}.tree{text-align:center;font-size:70px}.bar{height:11px;background:#e5eadf;border-radius:99px;overflow:hidden}.fill{height:100%;background:#5d8b65}.subject,.deadline,.score{padding:12px;border:1px solid var(--line);border-radius:14px;margin:9px 0}.deadline,.score{display:flex;justify-content:space-between;align-items:center}.chapter{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border-top:1px dashed var(--line);padding:8px}.pill{background:#d8e8cf;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}button{border:0;border-radius:11px;padding:9px 12px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#edf2e8;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0ec;color:#8a4538}.hidden{display:none}.modal{position:fixed;inset:0;background:#18251c77;display:grid;place-items:center;padding:18px}.modal>div{max-width:560px;width:100%;background:var(--card);padding:20px;border-radius:22px}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px}.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}@media(max-width:750px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{align-items:flex-start;flex-direction:column}}
body.mood-great{--bg:#eaf5df;--accent:#4f8c59}body.mood-meh{--bg:#e8eee9}body.mood-tired{--bg:#e5e5ef;--accent:#687394}body.mood-overwhelmed{--bg:#e3eceb;--accent:#5e7e7b}body.mood-notgreat{--bg:#f1e8df;--accent:#8a7062}
</style></head>
<body><div class="wrap">
<header class="hero"><div><div class="logo">🌿 StudyBloom</div><div class="tag">Grow your knowledge. Watch it bloom.</div></div><span id="greeting" class="pill"></span></header>
<div class="grid">
<section class="card"><h2>🔥 Focus Grove</h2><p class="small">One total timer. Optionally split the finished session across subjects.</p><div id="timer" class="timer">00:00:00</div><div id="tree" class="tree">🌰</div><div class="row"><button onclick="toggleTimer()" id="start">▶ Start</button><button class="secondary" onclick="finishSession()">⏹ Finish</button><button class="secondary" onclick="resetTimer()">↺ Reset</button></div><div id="allocation" class="hidden"><h3>📚 Where did those minutes go?</h3><div id="allocationRows"></div><button onclick="saveAllocation()">Save breakdown</button><button class="secondary" onclick="skipAllocation()">Skip</button></div></section>
<section class="card"><h2>🌱 Sprout's Campfire</h2><p id="sprout"></p><h3>How are you feeling?</h3><div id="moods" class="moods"></div></section>
<section class="card wide"><div class="row between"><h2>📚 Subjects</h2><button class="secondary" onclick="openSubject()">➕ Add subject</button></div><div id="subjects"></div></section>
<section class="card"><div class="row between"><h2>⏰ Deadlines</h2><button class="secondary" onclick="openTask()">➕ Add</button></div><div id="tasks"></div></section>
<section class="card"><div class="row between"><h2>📊 Test Journal</h2><button class="secondary" onclick="openScore()">➕ Log score</button></div><div id="scores"></div></section>
<section class="card wide"><h2>🌳 Enchanted Garden</h2><div id="garden" class="tree">🌱</div><p id="gardenText" style="text-align:center"></p></section>
</div></div><div id="modal" class="modal hidden"><div><div class="row between"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const defaults=["📐 Mathematics","🧬 Biology","⚡ Physics","⚗️ Chemistry","🌍 Social Science","📖 English","ગુજરાતી Gujarati","📝 Hindi","💻 Computer"];
let state=JSON.parse(localStorage.getItem("studybloom-vnext")||"null")||{subjects:defaults.map(x=>{let [icon,...n]=x.split(" ");return{name:n.join(" "),icon,chapters:[],minutes:0}}),tasks:[],scores:[],totalMinutes:0,mood:"okay"};
let seconds=0,ticking=false,interval=null,lastSession=0,lastSprout="";
const msgs={great:["The forest is sparkling today. Let's make something bloom. ✨","ENERGY DETECTED. Academic vines deployed. 🌿","Your vibes are suspiciously productive. 💀"],okay:["One useful step is enough. 🌱","The forest is ready whenever you are.","No heroic quest required today."],meh:["Meh days count too. Pick one tiny thing.","We can just plant one seed today. 🌱","Tiny progress still counts."],tired:["Sleepy forest mode activated. 🌙","No need to conquer the syllabus tonight.","The trees aren't judging you. 🌳"],overwhelmed:["One thing at a time. 🌿","We are NOT fighting the whole semester at once.","Pause. Breathe. Pick the next single step."],notgreat:["A rough day doesn't define your progress. 💚","No guilt. Just one manageable next step.","The next step can be tiny. 🌱"]};
function save(){localStorage.setItem("studybloom-vnext",JSON.stringify(state))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function prog(s){return s.chapters.length?Math.round(s.chapters.reduce((a,c)=>a+Number(c.progress||0),0)/s.chapters.length):0}
function render(){document.body.className="mood-"+state.mood;let h=new Date().getHours();document.getElementById("greeting").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+" 🌿";
document.getElementById("subjects").innerHTML=state.subjects.map((s,i)=>{let p=prog(s);return `<div class="subject"><div class="row between"><b>${s.icon} ${esc(s.name)}</b><span class="pill">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="small">${s.chapters.filter(c=>c.progress>=100).length}/${s.chapters.length} chapters complete · ${s.minutes||0} min logged</span><details><summary>Review chapters</summary>${s.chapters.map((c,j)=>`<div class="chapter"><span>${c.progress>=100?"✅":c.progress>0?"🟡":"⬜"}</span><span><b>${esc(c.name)}</b><br><span class="small">${c.progress}%</span></span><span><button class="secondary" onclick="editChapter(${i},${j})">✏️</button><button class="danger" onclick="removeChapter(${i},${j})">✕</button></span></div>`).join("")}<button class="secondary" onclick="addChapter(${i})">➕ Add chapter</button></details></div>`}).join("");
document.getElementById("tasks").innerHTML=state.tasks.length?state.tasks.map((t,i)=>`<div class="deadline"><span>${esc(t.name)}</span><span>${t.days}d <button class="secondary" onclick="editTask(${i})">✏️</button><button class="danger" onclick="removeTask(${i})">✕</button></span></div>`).join(""):"<p class=small>No quests yet. 🌿</p>";
document.getElementById("scores").innerHTML=state.scores.length?state.scores.slice().reverse().map((s,r)=>{let i=state.scores.length-1-r,p=Math.round(100*s.score/s.max);return `<div class=score><span><b>${esc(s.subject)}</b><br><span class=small>${esc(s.name)} · ${s.score}/${s.max} (${p}%)</span><div class=bar><div class=fill style="width:${p}%"></div></div></span><span><button class=secondary onclick="editScore(${i})">✏️</button><button class=danger onclick="removeScore(${i})">✕</button></span></div>`}).join(""):"<p class=small>No scores logged yet.</p>";
let lvl=Math.floor(state.totalMinutes/60),trees=["🌱","🌿","🌳","🌲","🌳✨","🌳🏡"];document.getElementById("garden").textContent=trees[Math.min(lvl,trees.length-1)];document.getElementById("gardenText").textContent=`${state.totalMinutes} focused minutes · ${lvl} hour${lvl==1?"":"s"} grown`;sprout();document.querySelectorAll("#moods button").forEach(b=>b.classList.toggle("active",b.dataset.mood==state.mood))}
function sprout(){let p=msgs[state.mood]||msgs.okay,pick=p.filter(x=>x!=lastSprout);lastSprout=pick[Math.floor(Math.random()*pick.length)]||p[0];document.getElementById("sprout").textContent=lastSprout}
function mood(m){state.mood=m;save();render()}document.getElementById("moods").innerHTML=[["great","😊 Great"],["okay","😌 Okay"],["meh","😐 Meh"],["tired","😴 Tired"],["overwhelmed","😵 Overwhelmed"],["notgreat","🌧️ Not great"]].map(x=>`<button class=secondary onclick="mood('${x[0]}')">${x[1]}</button>`).join("");
function updateTimer(){let a=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60];document.getElementById("timer").textContent=a.map(x=>String(x).padStart(2,"0")).join(":");document.getElementById("start").textContent=ticking?"⏸ Pause":"▶ Start";document.getElementById("tree").textContent=seconds>=3600?"🌳":seconds>=1800?"🌿":seconds>=600?"🌱":"🌰"}
function toggleTimer(){if(ticking){clearInterval(interval);ticking=false}else{interval=setInterval(()=>{seconds++;updateTimer()},1000);ticking=true}updateTimer()}
function resetTimer(){clearInterval(interval);ticking=false;seconds=0;updateTimer()}
function finishSession(){if(seconds<60)return alert("Study for at least a minute first 🌱");clearInterval(interval);ticking=false;lastSession=Math.floor(seconds/60);state.totalMinutes+=lastSession;seconds=0;updateTimer();showAllocation(lastSession);save();render()}
function showAllocation(m){document.getElementById("allocation").classList.remove("hidden");document.getElementById("allocationRows").innerHTML=state.subjects.map((s,i)=>`<div class=row><span style="min-width:150px">${s.icon} ${esc(s.name)}</span><input id=a${i} type=number min=0 max=${m} value=0 placeholder="minutes"></div>`).join("")}
function saveAllocation(){let total=0;state.subjects.forEach((s,i)=>{let n=Number(document.getElementById("a"+i).value)||0;total+=n;s.minutes=(s.minutes||0)+n});if(total>lastSession)return alert("Subject minutes can't exceed the session total.");save();skipAllocation();render()}function skipAllocation(){document.getElementById("allocation").classList.add("hidden")}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.remove("hidden")}function closeModal(){modal.classList.add("hidden")}
function openSubject(){openModal("🌱 Add subject",`<input id=fName placeholder="Subject name"><input id=fIcon placeholder="Emoji/icon (optional)"><button onclick="saveSubject()">Add subject</button>`)}function saveSubject(){let n=fName.value.trim();if(!n)return;if(state.subjects.some(s=>s.name.toLowerCase()==n.toLowerCase()))return alert("That subject already exists.");state.subjects.push({name:n,icon:fIcon.value.trim()||"📚",chapters:[],minutes:0});save();closeModal();render()}
function addChapter(i){openModal("📚 Add chapter",`<input id=fName placeholder="Chapter/topic"><select id=fProgress><option value=0>Not started</option><option value=25>25%</option><option value=50>50%</option><option value=75>75%</option><option value=100>Completed</option></select><button onclick="saveChapter(${i})">Add chapter</button>`)}function saveChapter(i){let n=fName.value.trim();if(!n)return;state.subjects[i].chapters.push({name:n,progress:+fProgress.value});save();closeModal();render()}
function editChapter(i,j){let c=state.subjects[i].chapters[j];openModal("✏️ Edit chapter",`<input id=fName value="${esc(c.name)}"><select id=fProgress><option value=0>Not started</option><option value=25>25%</option><option value=50>50%</option><option value=75>75%</option><option value=100>Completed</option></select><button onclick="updateChapter(${i},${j})">Save</button><button class=danger onclick="removeChapter(${i},${j});closeModal()">Delete</button>`);fProgress.value=c.progress}function updateChapter(i,j){state.subjects[i].chapters[j]={name:fName.value.trim(),progress:+fProgress.value};save();closeModal();render()}function removeChapter(i,j){if(confirm("Remove this chapter?")){state.subjects[i].chapters.splice(j,1);save();render()}}
function openTask(i=null){let t=i==null?{name:"",days:0}:state.tasks[i];openModal(i==null?"⏰ Add task":"✏️ Edit task",`<input id=fName value="${esc(t.name)}" placeholder="Task/deadline"><input id=fDays type=number min=0 value=${t.days} placeholder="Days left"><button onclick="saveTask(${i==null?"null":i})">Save</button>`)}function saveTask(i){let n=fName.value.trim();if(!n)return;let t={name:n,days:+fDays.value||0};i==null?state.tasks.push(t):state.tasks[i]=t;save();closeModal();render()}function editTask(i){openTask(i)}function removeTask(i){if(confirm("Remove this task?")){state.tasks.splice(i,1);save();render()}}
function openScore(i=null){let s=i==null?{subject:state.subjects[0]?.name||"",name:"",score:0,max:100}:state.scores[i];openModal(i==null?"📊 Log test score":"✏️ Correct test score",`<select id=fSubject>${state.subjects.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select><input id=fName value="${esc(s.name)}" placeholder="Test name"><div class=row><input id=fScore type=number min=0 value=${s.score} placeholder="Score"><input id=fMax type=number min=1 value=${s.max} placeholder="Maximum"></div><button onclick="saveScore(${i==null?"null":i})">Save score</button>`);fSubject.value=s.subject}function saveScore(i){let score=+fScore.value,max=+fMax.value;if(!max||score<0||score>max)return alert("Please enter a valid score.");let s={subject:fSubject.value,name:fName.value.trim()||"Test",score,max};i==null?state.scores.push(s):state.scores[i]=s;save();closeModal();render()}function editScore(i){openScore(i)}function removeScore(i){if(confirm("Delete this score?")){state.scores.splice(i,1);save();render()}}
render();updateTimer();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
